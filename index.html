<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        
        <div class="input-group">
            <label for="longUrl">Enter your long URL:</label>
            <input type="url" id="longUrl" placeholder="https://example.com/very/long/url" required>
        </div>
        
        <button onclick="shortenUrl()">Shorten URL</button>
        
        <div class="result" id="result">
            <strong>Your shortened URL:</strong>
            <div class="short-url">
                <input type="text" id="shortUrlDisplay" readonly>
                <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
            </div>
            <div class="success-msg" id="successMsg">✓ Copied to clipboard!</div>
        </div>

        <div class="url-list" id="urlList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
